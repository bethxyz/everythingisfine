<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f3f5">
<meta name="description" content="Everything Is Fine. A tiny, deeply British endless runner. Jump the obstacles. Duck the pigeons. Pretend nothing's wrong.">
<title>EVERYTHING IS FINE. — A British survival simulator</title>
<style>
  :root{color-scheme:light;--ink:#292d33;--mid:#747a84;--paper:#f2f3f5;--soft:#dce0e5}
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html{min-height:100%;background:var(--paper)}
  body{min-height:100vh;margin:0;background:var(--paper);color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;-webkit-font-smoothing:none;display:grid;place-items:center}
  main{width:100%;max-width:1050px;padding:clamp(30px,6vh,68px) clamp(14px,3vw,34px);margin:auto}
  /* Neutral reserved spaces: no ad network or third-party scripts are loaded. */
  .ad-space{width:min(728px,100%);height:90px;display:flex;align-items:center;justify-content:center;text-align:center;margin-inline:auto;background:#eceef1;border:1px dashed #bdc3cc;color:#777f8c;font:700 11px ui-monospace,monospace;letter-spacing:.06em;text-decoration:none;cursor:pointer}
  .ad-space:visited{color:#777f8c}
  .ad-space:hover{background:#e3e7ec;border-color:#929aa6;color:var(--ink)}
  .ad-space:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
  .ad-space-top{margin-bottom:clamp(27px,5vh,48px)}
  .ad-space-bottom{margin-top:clamp(30px,5vh,52px)}
  .ad-mobile-label{display:none}
  .masthead{text-align:center;margin:0 0 clamp(32px,5vh,52px)}
  .pixel-title{display:block;width:min(100%,560px);height:auto;margin:0 auto;image-rendering:pixelated;image-rendering:crisp-edges}
  .sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  .subtitle{color:var(--mid);margin:12px 0 0;font-size:11px;letter-spacing:.035em}
  .game-shell{background:var(--paper)}
  .hud{min-height:37px;padding:0 4px 10px;display:flex;align-items:end;justify-content:space-between;gap:18px}
  .hud-sound{padding:0;min-height:24px;font-size:11px;font-weight:900;letter-spacing:.045em;color:var(--ink);text-align:left}
  .tiny-label{color:var(--mid);font-size:10px;font-weight:700;letter-spacing:.06em}
  .scores{display:flex;gap:23px;flex:none;align-items:baseline}
  .score-block{display:flex;align-items:baseline;gap:7px}
  .score-block strong{font-size:14px;font-weight:900;letter-spacing:.035em;font-variant-numeric:tabular-nums}
  .game-area{position:relative;aspect-ratio:640 / 235;overflow:hidden;isolation:isolate;background:var(--paper);touch-action:none}
  .game-area > canvas{display:block;position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
  .overlay{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;background:rgba(242,243,245,.86)}
  .overlay.hidden{display:none}
  .overlay-card{width:min(470px,100%);padding:10px 13px}
  .incident-panel{margin:0 auto}
  .overlay.is-incident .incident-panel{max-width:430px;border:2px solid var(--ink);background:var(--paper);box-shadow:4px 4px 0 var(--soft);padding:13px 15px 16px;margin:0 auto}
  .overlay.is-incident .overlay-kicker{margin-bottom:7px}
  /* Keep an accessible heading, but render the incident heading in actual pixels. */
  .overlay.is-incident .overlay-title{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  .incident-pixel-title{display:block;width:min(100%,380px);height:auto;margin:0 auto 11px;image-rendering:pixelated;image-rendering:crisp-edges}
  .overlay.is-incident .overlay-desc{margin-bottom:0}
  .overlay-kicker{font-size:9px;letter-spacing:.1em;font-weight:900;color:var(--mid);margin:0 0 11px}
  .overlay-title{font-size:clamp(19px,3vw,29px);font-weight:900;letter-spacing:-.06em;line-height:1.12;margin:0 0 10px}
  .overlay-desc{font-size:11px;line-height:1.55;max-width:380px;margin:0 auto 14px}
  .overlay-keys{display:flex;justify-content:center;gap:19px;align-items:center;margin:0 0 17px}
  .key-hint{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:10px;white-space:nowrap}
  kbd{font:700 10px ui-monospace,monospace;border:1px solid #a3a9b2;padding:4px 6px;color:var(--ink);background:var(--paper)}
  .overlay-actions{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:15px}
  .pixel-btn{border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);padding:11px 15px;font:900 11px ui-monospace,monospace;letter-spacing:.015em;min-height:37px;cursor:pointer;touch-action:manipulation}
  .pixel-btn:hover{background:#4b515b}
  .pixel-btn.secondary{background:var(--paper);color:var(--ink)}
  .pixel-btn.secondary:hover{background:var(--soft)}
  .strip{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 4px 0}
  .strip-controls{display:flex;align-items:center;flex-wrap:wrap;gap:16px;min-width:0;color:var(--mid)}
  .strip-control{display:inline-flex;align-items:center;gap:7px;font-size:10px;letter-spacing:.015em;white-space:nowrap}
  .strip-control kbd{color:var(--ink);border-color:#abb1b9;padding:3px 5px;font-size:10px}
  .strip-control strong{font-size:10px;font-weight:800;letter-spacing:.045em;color:var(--mid)}
  .icon-btn{border:0;background:none;padding:6px 0 6px 10px;font:700 10px ui-monospace,monospace;color:var(--mid);white-space:nowrap;cursor:pointer}
  .icon-btn:hover{color:var(--ink)}
  .touch-controls{display:none;justify-content:center;gap:12px;margin:20px auto 0}
  .touch-btn{flex:1;max-width:230px;height:57px;border:1px solid var(--ink);background:var(--paper);color:var(--ink);font:900 12px ui-monospace,monospace;touch-action:none;user-select:none;-webkit-user-select:none}
  .touch-btn:active,.touch-btn.pressed{background:var(--ink);color:var(--paper)}
  .pixel-btn:focus-visible,.icon-btn:focus-visible,.touch-btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
  @media(hover:none),(pointer:coarse){.touch-controls{display:flex}}
  @media(max-width:680px){
    .ad-space{width:min(320px,100%);height:100px;font-size:10px}
    .ad-desktop-label{display:none}.ad-mobile-label{display:inline}
    .ad-space-top{margin-bottom:26px}.ad-space-bottom{margin-top:30px}
    main{padding:32px 12px 28px}
    .masthead{margin-bottom:27px}.pixel-title{width:min(100%,460px)}.subtitle{font-size:10px}
    .hud{min-height:27px;padding-bottom:7px;gap:8px}
    .hud-sound{font-size:9px;min-height:22px}
    .game-area.incident-active{min-height:260px;aspect-ratio:auto}
    .overlay.is-incident .overlay-card{padding:4px 6px}
    .overlay.is-incident .incident-panel{padding:11px 10px 12px;margin-bottom:0;box-shadow:3px 3px 0 var(--soft)}
    .overlay.is-incident .overlay-actions{margin-top:11px;gap:8px}
    .incident-pixel-title{width:min(100%,350px);margin-bottom:8px}
    .overlay.is-incident .overlay-desc{font-size:10px;line-height:1.4}
    .scores{gap:10px}.score-block{gap:4px}.tiny-label{font-size:8px}.score-block strong{font-size:11px}
    .game-area{aspect-ratio:640 / 275}
    .overlay{padding:4px}.overlay-card{padding:2px 6px}
    .overlay-kicker{font-size:8px;margin:0 0 5px}.overlay-title{font-size:clamp(17px,5vw,23px);margin-bottom:5px}
    .overlay-desc{font-size:9px;line-height:1.3;margin-bottom:8px}.overlay-keys{gap:12px;margin-bottom:8px}
    .key-hint{font-size:9px}.key-hint kbd{font-size:9px;padding:2px 5px}
    .pixel-btn{min-height:30px;padding:6px 11px;font-size:10px}
    .strip{padding-top:8px;gap:6px}.strip-controls{gap:11px}.strip-control{gap:5px;font-size:9px}.strip-control kbd{padding:2px 4px;font-size:9px}.strip-control strong{font-size:9px}.icon-btn{font-size:9px}
  }
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style>
</head>
<body>
<main>
  <a class="ad-space ad-space-top" href="mailto:ads@everythingisfine.run" aria-label="Enquire about top advertising space: email ads@everythingisfine.run" title="Email ads@everythingisfine.run about advertising">
    <span class="ad-desktop-label">ADVERTISING SPACE — 728 × 90 px</span>
    <span class="ad-mobile-label">ADVERTISING SPACE — 320 × 100 px</span>
  </a>
  <header class="masthead">
    <canvas id="titleCanvas" class="pixel-title" width="560" height="56" aria-hidden="true"></canvas>
    <h1 class="sr-only">EVERYTHING IS FINE.</h1>
    <p class="subtitle">A British survival simulator. Keep calm and carry on.</p>
  </header>
  <section class="game-shell" aria-label="Everything Is Fine endless runner game">
    <div class="hud">
      <button id="soundBtn" class="icon-btn hud-sound" type="button" aria-pressed="true">SOUND: ON</button>
      <div class="scores"><div class="score-block"><span class="tiny-label">SCORE</span><strong id="score">00000</strong></div><div class="score-block"><span class="tiny-label">BEST</span><strong id="best">00000</strong></div></div>
    </div>
    <div class="game-area" id="gameArea">
      <canvas id="game" width="640" height="235" role="img" aria-label="Pixel-art runner. A weary British commuter runs automatically. Press Space to jump ground obstacles and hold the Down arrow to duck under flying obstacles."></canvas>
      <div id="overlay" class="overlay hidden">
        <div class="overlay-card">
          <div class="incident-panel">
            <p id="overlayKicker" class="overlay-kicker">OFFICIAL INCIDENT REPORT</p>
            <h2 class="overlay-title" id="overlayTitle">YOU SURVIVED 0 SECONDS.</h2>
            <canvas id="incidentTitleCanvas" class="incident-pixel-title" width="380" height="48" aria-hidden="true" hidden></canvas>
            <p class="overlay-desc" id="overlayDesc"></p>
            <div class="overlay-actions"><button id="startBtn" class="pixel-btn" type="button">TRY AGAIN ↻</button><button id="shareBtn" class="pixel-btn secondary" type="button" hidden>SHARE MISERY ↗</button></div>
          </div>
        </div>
      </div>
    </div>
    <div class="strip">
      <div class="strip-controls" aria-label="Game controls">
        <span class="strip-control"><kbd>SPACE</kbd><strong>JUMP</strong></span>
        <span class="strip-control"><kbd>↓</kbd><strong>DUCK</strong></span>
      </div>
    </div>
  </section>
  <div class="touch-controls" aria-label="Mobile game controls"><button class="touch-btn" id="jumpBtn" type="button">↑ JUMP</button><button class="touch-btn" id="duckBtn" type="button">↓ DUCK (HOLD)</button></div>
  <a class="ad-space ad-space-bottom" href="mailto:ads@everythingisfine.run" aria-label="Enquire about bottom advertising space: email ads@everythingisfine.run" title="Email ads@everythingisfine.run about advertising">
    <span class="ad-desktop-label">ADVERTISING SPACE — 728 × 90 px</span>
    <span class="ad-mobile-label">ADVERTISING SPACE — 320 × 100 px</span>
  </a>
</main>
<script>
(()=>{'use strict';
  const canvas=document.getElementById('game'), ctx=canvas.getContext('2d',{alpha:false});
  if(!ctx) return;
  ctx.imageSmoothingEnabled=false;
  const W=640,H=235,G=188,INK='#292d33', MID='#7f8691', PALE='#bec4cd', BG='#f2f3f5';
  const BIN_GREEN='#3f8f43', BIN_GREEN_DARK='#2a6630', BIN_GREEN_LIGHT='#76b779';
  const BIN_RED='#b14a46', BIN_RED_DARK='#7e2f2b', BIN_RED_LIGHT='#d07a74';
  const POO_BROWN='#70502c', POO_BROWN_DARK='#4c3218';
  const DOG_GREYBLUE='#768a9b', DOG_GREYBLUE_DARK='#566877', DOG_GREYBLUE_LIGHT='#98a9b7';
  const PIGEON_GREY='#8e959d', PIGEON_GREY_DARK='#68727c', PIGEON_BREAST='#91a79e';
  const CONE_ORANGE='#ef8b21', CONE_ORANGE_DARK='#c76510';
  const BILL_RED='#d24845', BILL_RED_DARK='#a72f31';
  const $=id=>document.getElementById(id);
  const ui={overlay:$('overlay'),kicker:$('overlayKicker'),title:$('overlayTitle'),desc:$('overlayDesc'),start:$('startBtn'),share:$('shareBtn'),score:$('score'),best:$('best'),sound:$('soundBtn'),jump:$('jumpBtn'),duck:$('duckBtn')};
  const titleCanvas=$('titleCanvas'), incidentTitleCanvas=$('incidentTitleCanvas');
  const stages=[
    {threshold:0,ticker:'PLEASE REMAIN CALM. THE SITUATION IS UNDER CONTROL.'},
    {threshold:90,ticker:'ROADWORKS EXPECTED TO FINISH IN 2047.'},
    {threshold:230,ticker:'AN INVESTIGATION HAS BEEN LAUNCHED INTO THE OTHER INVESTIGATION.'},
    {threshold:420,ticker:'THE NATIONAL EMERGENCY HOTLINE IS CURRENTLY UNAVAILABLE.'},
    {threshold:670,ticker:'GOVERNMENT SPOKESPERSON: "EVERYTHING IS FINE."'}
  ];
  const outcomes={
    cone:["You were defeated by a traffic cone. Very British.","Road closed. Alternative route: none."],
    bin:["A wheelie bin has ended your promising career.","Bin day has been postponed indefinitely."],
    poo:["You were bested by a suspicious pavement deposit.","Dog fouling remains a live issue in your borough."],
    dog:["A Staffordshire Bull Terrier has interrupted proceedings.","You have been outmatched by a stocky local celebrity."],
    gull:["A seagull has been promoted ahead of you.","A seagull has claimed your chips and your dignity."],
    bill:["Your energy bill has finally caught up with you.","FINAL NOTICE: optimism has been discontinued."]
  };
  let mode='ready',score=0,best=0,stage=0,dist=0,frame=0,world=0,last=0,spawnIn=230,obstacles=[],particles=[],duckHeld=false,muted=false,audio=null,runId=0;
  let pint=null,pintIn=275,invincible=0;
  const PINT_SECONDS=4, PINT_DURATION=PINT_SECONDS*60, BEER='#d2a747', BEER_DARK='#85642b', BEER_FOAM='#f8f9fb';
  const person={jump:0,vy:0,duck:false,blink:0};
  function getBest(){try{return Math.max(0,parseInt(localStorage.getItem('everything-is-fine-best')||'0',10)||0)}catch(e){return 0}}
  function setBest(v){try{localStorage.setItem('everything-is-fine-best',String(v))}catch(e){}}
  best=getBest();ui.best.textContent=pad(best);
  function pad(n){return String(Math.floor(n)).padStart(5,'0')}
  function R(x,y,w,h,c=INK){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.ceil(w),Math.ceil(h))}
  function L(x,y,x2,y2,c=INK){ctx.strokeStyle=c;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(Math.round(x)+.5,Math.round(y)+.5);ctx.lineTo(Math.round(x2)+.5,Math.round(y2)+.5);ctx.stroke()}
  function txt(s,x,y,size=9,color=INK,align='left'){ctx.font=`900 ${size}px monospace`;ctx.textAlign=align;ctx.fillStyle=color;ctx.fillText(s,x,y);ctx.textAlign='left'}
  function rng(n){return Math.floor(Math.random()*n)}
  function sound(freq,dur=.08,type='square',vol=.027){if(muted)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let osc=audio.createOscillator(),gain=audio.createGain(),t=audio.currentTime;osc.type=type;osc.frequency.setValueAtTime(freq,t);osc.frequency.exponentialRampToValueAtTime(Math.max(30,freq*.66),t+dur);gain.gain.setValueAtTime(vol,t);gain.gain.exponentialRampToValueAtTime(.0001,t+dur);osc.connect(gain);gain.connect(audio.destination);osc.start(t);osc.stop(t+dur)}catch(e){}}

  // Both title screens use precisely the same hand-drawn 5x7 glyphs.
  const titleGlyphs={
    '0':['01110','10001','10011','10101','11001','10001','01110'],
    '1':['00100','01100','00100','00100','00100','00100','01110'],
    '2':['01110','10001','00001','00010','00100','01000','11111'],
    '3':['11110','00001','00001','01110','00001','00001','11110'],
    '4':['00010','00110','01010','10010','11111','00010','00010'],
    '5':['11111','10000','10000','11110','00001','00001','11110'],
    '6':['01111','10000','10000','11110','10001','10001','01110'],
    '7':['11111','00001','00010','00100','01000','01000','01000'],
    '8':['01110','10001','10001','01110','10001','10001','01110'],
    '9':['01110','10001','10001','01111','00001','00001','11110'],
    'C':['01111','10000','10000','10000','10000','10000','01111'],
    'D':['11110','10001','10001','10001','10001','10001','11110'],
    'O':['01110','10001','10001','10001','10001','10001','01110'],
    'U':['10001','10001','10001','10001','10001','10001','01110'],
    'X':['10001','10001','01010','00100','01010','10001','10001'],
    'A':['01110','10001','10001','11111','10001','10001','10001'],
    'E':['11111','10000','10000','11110','10000','10000','11111'],
    'F':['11111','10000','10000','11110','10000','10000','10000'],
    'G':['01111','10000','10000','10011','10001','10001','01110'],
    'H':['10001','10001','10001','11111','10001','10001','10001'],
    'I':['11111','00100','00100','00100','00100','00100','11111'],
    'N':['10001','11001','10101','10011','10001','10001','10001'],
    'R':['11110','10001','10001','11110','10100','10010','10001'],
    'S':['01111','10000','10000','01110','00001','00001','11110'],
    'T':['11111','00100','00100','00100','00100','00100','00100'],
    'V':['10001','10001','10001','10001','10001','01010','00100'],
    'Y':['10001','10001','01010','00100','00100','00100','00100'],
    '.':['00000','00000','00000','00000','00000','00110','00110'],
    ' ':['000','000','000','000','000','000','000']
  };
  function drawPixelTitle(target){
    if(!target || target.hidden)return;
    const context=target.getContext('2d');
    if(!context)return;
    const phrase=target===titleCanvas?'EVERYTHING IS FINE.':ui.title.textContent;
    const maxWidth=target===titleCanvas?560:380;
    // Compute width from actual glyphs, so the variable seconds label always fits.
    const cssW=Math.min(target.clientWidth||maxWidth,maxWidth);
    let cols=0;
    for(const ch of phrase)cols+=(titleGlyphs[ch]?.[0].length||5)+1;
    cols--;
    const scale=target===titleCanvas?Math.max(2,Math.floor(cssW/120)):Math.max(1,Math.floor((cssW-16)/cols));
    const pixelW=cols*scale;
    const padX=Math.max(6,Math.floor(scale*2));
    const padY=Math.max(6,Math.floor(scale*1.75));
    const width=pixelW+padX*2, height=7*scale+padY*2;
    target.width=width;
    target.height=height;
    target.style.aspectRatio=`${width} / ${height}`;
    context.imageSmoothingEnabled=false;
    context.fillStyle=BG;
    context.fillRect(0,0,width,height);
    let x=Math.floor((width-pixelW)/2);
    for(const ch of phrase){
      const glyph=titleGlyphs[ch]||titleGlyphs[' '];
      const gw=glyph[0].length;
      for(let ry=0;ry<glyph.length;ry++){
        for(let rx=0;rx<gw;rx++){
          if(glyph[ry][rx]==='1'){
            context.fillStyle=INK;
            context.fillRect(x+rx*scale,padY+ry*scale,scale,scale);
          }
        }
      }
      x+=(gw+1)*scale;
    }
  }
  function refreshPixelTitles(){drawPixelTitle(titleCanvas);drawPixelTitle(incidentTitleCanvas)}
  window.addEventListener('resize',refreshPixelTitles);
  refreshPixelTitles();

  function updateHud(){ui.score.textContent=pad(score);ui.best.textContent=pad(best)}
  function setStage(s){if(s===stage)return;stage=s;if(mode==='playing'){sound(650,.15,'square',.019);for(let k=0;k<12;k++)particles.push({x:450+rng(30),y:70+rng(16),vx:(rng(6)-3)*.4,vy:-rng(3)*.2,life:20+rng(30)})}}
  function reset(){score=0;dist=0;frame=0;world=0;spawnIn=225;obstacles=[];particles=[];pint=null;pintIn=275;invincible=0;person.jump=0;person.vy=0;person.duck=false;duckHeld=false;runId++;stage=0;updateHud()}
  function begin(jumpImmediately=false){reset();mode='playing';ui.overlay.classList.remove('is-incident');$('gameArea').classList.remove('incident-active');ui.overlay.classList.add('hidden');if(jumpImmediately)jump();sound(270,.09)}
  function jump(){if(mode!=='playing'){begin(true);return}if(person.jump===0&&!person.duck){person.jump=.01;person.vy=7.35;sound(570,.09);for(let i=0;i<4;i++)particles.push({x:100+rng(15),y:G-1,vx:-1-rng(2),vy:-rng(2),life:15})}}
  function setDuck(v){if(mode==='ready'&&v)begin(false);duckHeld=v;if(mode==='playing')person.duck=duckHeld&&person.jump===0}
  function spawn(){const pool=['cone','bin','poo'];if(score>=55)pool.push('dog');if(score>=35)pool.push('gull');if(score>=120)pool.push('bill');if(score>=250)pool.push('gull','gull','dog');const kind=pool[rng(pool.length)];const config={cone:{w:19,h:22},bin:{w:34,h:39},poo:{w:20,h:10},dog:{w:34,h:24},gull:{w:31,h:13},bill:{w:31,h:15}}[kind];const variant=kind==='bin'?(rng(2)?'green':'red'):null;obstacles.push({kind,x:W+30,w:config.w,h:config.h,wing:rng(20),variant});const speed=3.2+Math.min(3.5,score/205);spawnIn=155+rng(105)+speed*8;if(score>500)spawnIn-=10}
  function collectPint(){
    // Exactly four seconds at the game's normal 60fps time scale.
    pint=null;invincible=PINT_DURATION;
    sound(840,.17,'square',.025);
    for(let i=0;i<16;i++)particles.push({x:102+rng(28),y:G-35-rng(42),vx:(rng(100)-50)/18,vy:-rng(30)/12,life:18+rng(24),gold:true});
  }
  function pintCollision(){
    if(!pint)return false;
    const pw=person.duck?33:30,ph=person.duck?15:44,px=96,py=G-person.jump-ph;

    R(x+20,y-23+bob,4,5,DOG_GREYBLUE_DARK);             // folded left ear
    R(x+27,y-24+bob,3,6,DOG_GREYBLUE_DARK);             // triangular right ear
    R(x+28,y-16+bob,6,5,DOG_GREYBLUE);             // short square muzzle
    R(x+32,y-15+bob,2,2,INK);             // nose
    R(x+25,y-18+bob,2,2,BG);              // expressive small eye
    R(x+21,y-12+bob,2,6,DOG_GREYBLUE_LIGHT);              // front-neck/chest highlight
    // Bright red collar, with alternating icy-blue and white chunky pixel spikes.
    R(x+17,y-18+bob,10,5,'#942a38');  // shadow of red leather band
    R(x+18,y-17+bob,9,3,'#dc3c4e');   // red collar front
    R(x+17,y-20+bob,2,3,'#ffffff');   // white rear spike
    R(x+20,y-22+bob,2,5,'#64b6ee');   // tall blue centre spike
    R(x+21,y-22+bob,1,3,'#d9f2ff');  // icy-blue glint
    R(x+24,y-20+bob,2,3,'#ffffff');   // white front spike
    R(x+19,y-16+bob,1,1,'#fff1f1');  // stud highlight
    R(x+23,y-13+bob,2,2,'#64b6ee'); // blue tag
    R(x+8,y-7+bob,5,7-bob,DOG_GREYBLUE_DARK);           // rear paws
    R(x+17,y-7+bob,5,7-bob,DOG_GREYBLUE_DARK);
    R(x+25,y-7+bob,5,7-bob,DOG_GREYBLUE_DARK);
    if(step)R(x+27,y-3,7,3,DOG_GREYBLUE_DARK);else R(x+23,y-2,8,2,DOG_GREYBLUE_DARK);
    R(x+3,y-16+bob,5,4,DOG_GREYBLUE_DARK);              // upturned wagging tail
    R(x+2,y-20+(step?0:2),3,6,DOG_GREYBLUE_DARK);
  }
  function drawPint(o){
    // A glistening amber pint. The outline is still crisp 1px canvas art,
    // with just enough colour and animated light to feel worth collecting.
    const x=Math.round(o.x),y=Math.round(o.y+Math.sin(o.wing*.10)*2);
    R(x+3,y+2,15,19,INK);               // chunky glass outline
    R(x+5,y+4,11,14,BEER);             // amber lager
    R(x+5,y+13,11,4,BEER_DARK);        // deeper beer near the base
    R(x+4,y+1,13,5,BEER_FOAM);         // thick frothy head
    R(x+3,y+2,15,2,BG);               // white foam crest
    R(x+2,y,17,2,INK);                // glass rim
    R(x+6,y+6,2,7,'#fcfdff');         // glistening vertical highlight
    R(x+6,y+20,10,2,PALE);            // heavy glass base
    // A handle of tiny sparkles that twinkle on alternating frames.
    const on=Math.floor(o.wing/8)%2;
    if(on===0){
      R(x-4,y+5,2,6,BEER);R(x-6,y+7,6,2,BEER);
      R(x+21,y-4,2,9,BEER_DARK);R(x+18,y-1,8,2,BEER_DARK);
    }else{
      R(x+21,y+6,2,8,BEER);R(x+18,y+9,8,2,BEER);
      R(x-5,y-3,2,8,BEER_DARK);R(x-8,y,8,2,BEER_DARK);
    }
  }
  function drawInvincibility(){
    if(invincible<=0)return;
    // Tight pixel-art shimmer following the commuter rather than a big UI box.
    const x=94,y=Math.round(G-person.jump),f=Math.floor(frame/5)%4;
    for(let i=0;i<4;i++){
      const a=(i+f)%4;
      const sx=x+[-11,35,6,30][a],sy=y+[-31,-30,-51,-9][a];
      R(sx,sy,3,3,i%2?BEER:BEER_FOAM);R(sx+1,sy-3,1,9,BEER_DARK);
    }
  }
  function drawPowerHud(){
    if(invincible<=0)return;
    const remaining=Math.max(0,invincible/60).toFixed(1);
    txt('PINT POWER '+remaining+'s',W-11,16,9,BEER_DARK,'right');
    R(W-104,21,93,4,PALE);
    R(W-104,21,Math.ceil(93*invincible/PINT_DURATION),4,BEER);
  }
  function drawForeground(){for(let i=0;i<obstacles.length;i++){const o=obstacles[i];if(o.kind==='cone')drawCone(o);else if(o.kind==='bin')drawBin(o);else if(o.kind==='poo')drawPoo(o);else if(o.kind==='dog')drawDog(o);else if(o.kind==='gull')drawGull(o);else drawBill(o)}if(pint)drawPint(pint);drawInvincibility();drawPerson();for(const p of particles)R(p.x,p.y,2,2,p.gold?BEER:(p.life<9?PALE:INK))}
  function render(){R(0,0,W,H,BG);drawBuildings();drawDistantExtras();if(stage>=4){R(540,19,2,11,INK);R(536,23,10,2,INK);R(534,25,14,1,PALE);txt('STILL FINE',517,46,7,MID)}drawRain();drawRoad();drawForeground();drawPowerHud();if(stage>=1&&invincible<=0)txt('!'+' '.repeat(0),W-26,20,16,MID)}
  function loop(time){if(!last)last=time;const dt=Math.min(2.3,(time-last)/16.6667||1);last=time;tick(dt);render();requestAnimationFrame(loop)}
  document.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowDown'){e.preventDefault();if(e.repeat&&e.code==='Space')return;if(e.code==='Space'){if(mode==='dead')begin(true);else jump()}else{if(mode==='dead')return;setDuck(true)}}});
  document.addEventListener('keyup',e=>{if(e.code==='ArrowDown'){e.preventDefault();setDuck(false)}});
  window.addEventListener('blur',()=>{duckHeld=false;person.duck=false});
  ui.start.addEventListener('click',()=>begin(false));
  ui.sound.addEventListener('click',()=>{muted=!muted;ui.sound.textContent='SOUND: '+(muted?'OFF':'ON');ui.sound.setAttribute('aria-pressed',String(!muted));sound(560,.08)});
  ui.share.addEventListener('click',async()=>{const message=`I survived ${Math.floor(frame/60)} seconds and scored ${Math.floor(score)} in EVERYTHING IS FINE. Britain's least reassuring browser game. ${location.href.startsWith('file:')?'':location.href}`.trim();try{if(navigator.share)await navigator.share({title:'Everything Is Fine',text:message});else if(navigator.clipboard){await navigator.clipboard.writeText(message);ui.share.textContent='COPIED ✓';setTimeout(()=>ui.share.textContent='SHARE MISERY ↗',1600)}else{ui.share.textContent='SHARE UNAVAILABLE';setTimeout(()=>ui.share.textContent='SHARE MISERY ↗',1600)}}catch(e){if(e.name!=='AbortError')ui.share.textContent='SHARE UNAVAILABLE'}});
  // Pointer controls, including mobile. These deliberately duplicate only Space/Down.
  ui.jump.addEventListener('pointerdown',e=>{e.preventDefault();jump()});
  ui.duck.addEventListener('pointerdown',e=>{e.preventDefault();ui.duck.classList.add('pressed');try{ui.duck.setPointerCapture(e.pointerId)}catch(ex){}setDuck(true)});
  for(const name of ['pointerup','pointercancel','lostpointercapture'])ui.duck.addEventListener(name,()=>{ui.duck.classList.remove('pressed');setDuck(false)});
  $('gameArea').addEventListener('pointerdown',e=>{if(e.target===canvas&&e.pointerType!=='mouse'&&mode!=='dead'){e.preventDefault();jump()}});
  begin(false);requestAnimationFrame(loop);
})();
</script>
